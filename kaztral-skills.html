<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaztral — Skills Studies</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08090b;color:#f2f2ef;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px}
.page{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:28px 34px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}
.status{font:11px/1 monospace;color:#85888d;letter-spacing:.15em;text-transform:uppercase}
.stage{position:relative;display:grid;place-items:center;min-height:0;perspective:1400px}
.stack{position:relative;width:min(72vw,780px);height:min(68vh,570px);transform-style:preserve-3d;touch-action:none;cursor:grab}
.stack.dragging{cursor:grabbing}
.card{--accent:#d7ff5f;position:absolute;inset:0;border:1px solid rgba(255,255,255,.14);border-radius:4px;overflow:hidden;background:#111316;transform-style:preserve-3d;will-change:transform,opacity;box-shadow:0 30px 80px rgba(0,0,0,.45);user-select:none}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,transparent 0 22%,rgba(0,0,0,.2) 75%)}
.card .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent)}
.content{position:absolute;inset:0;padding:clamp(24px,5vw,58px);display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.index{font:12px monospace;color:#999;letter-spacing:.12em}
.skill{font-size:clamp(54px,10vw,126px);line-height:.82;letter-spacing:-.075em;font-weight:850;max-width:85%;color:#f5f5f1}
.desc{font:12px monospace;color:#a5a7aa;text-transform:uppercase;letter-spacing:.12em}
.meta{display:flex;justify-content:space-between;align-items:end;font:11px monospace;color:#85888d}
.visual{position:absolute;right:-8%;top:17%;width:58%;height:65%;opacity:.78;transform:translateZ(35px) rotate(-10deg)}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,var(--accent) 1.2px,transparent 1.4px);background-size:10px 10px;mask-image:radial-gradient(circle at 50% 50%,black 0 32%,transparent 70%);animation:drift 8s linear infinite}
.ring{position:absolute;width:65%;aspect-ratio:1;border:1px solid var(--accent);border-radius:50%;left:18%;top:17%;box-shadow:0 0 35px color-mix(in srgb,var(--accent),transparent 75%),inset 0 0 35px color-mix(in srgb,var(--accent),transparent 88%);animation:spin 14s linear infinite}
.ring:before,.ring:after{content:"";position:absolute;inset:12%;border:1px dashed color-mix(in srgb,var(--accent),transparent 35%);border-radius:50%}
.ring:after{inset:28%;border-style:solid}
.cross{position:absolute;left:50%;top:50%;width:100%;height:1px;background:var(--accent);transform:rotate(28deg);box-shadow:0 0 20px var(--accent)}
.cross:after{content:"";position:absolute;left:50%;top:-50px;width:1px;height:100px;background:var(--accent);transform:rotate(-28deg)}
footer{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:5}
.hint{font:11px monospace;color:#666;letter-spacing:.08em}
.nav{display:flex;gap:7px}
.nav button{width:42px;height:34px;border:1px solid #303236;background:#101114;color:#ddd;cursor:pointer}
.nav button:hover{border-color:#777}
.counter{font:12px monospace;color:#888;margin-right:16px}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes drift{to{background-position:70px 30px}}
@media(max-width:650px){
.page{padding:20px}
.stage{margin:0 -8px}
.stack{width:88vw;height:62vh}
.content{padding:28px}
.skill{font-size:clamp(45px,14vw,80px)}
.visual{width:72%;right:-18%;top:22%}
.hint{display:none}
}
</style>
</head>
<body>
<div class="page">
<header class="top"><div class="brand">KAZTRAL<span style="color:#777">.</span></div><div class="status">SKILLS / STUDIES</div></header>
<main class="stage">
<div class="stack" id="stack"></div>
</main>
<footer>
<div class="hint">DRAG · ← → · SWIPE</div>
<div style="display:flex;align-items:center"><span class="counter" id="counter">01 / 12</span><div class="nav"><button id="prev" aria-label="Previous">←</button><button id="next" aria-label="Next">→</button></div></div>
</footer>
</div>
<script>
const skills=[
["PYTHON","Backend · Automation · Tools","#d7ff5f"],
["JAVASCRIPT","Web · Interaction · Applications","#7cf7ff"],
["HTML","Structure · Semantic Web · UI","#ff9d6c"],
["CSS","Design · Motion · Responsive UI","#c49cff"],
["BASH","Linux · CLI · Automation","#a9ff68"],
["GIT","Version Control · Collaboration","#ff6b7a"],
["LINUX","Systems · Servers · Development","#b5b8ff"],
["FLASK","Python · Web · APIs","#d9d9d0"],
["SQL","Data · Queries · Applications","#63d6ff"],
["APIs","Integration · Services · Automation","#ffcf5c"],
["DISCORD BOTS","Bots · APIs · Automation","#9bffbd"],
["AUTOMATION","Systems · Workflows · Tools","#ff8df4"]
];

const stack=document.getElementById("stack"), counter=document.getElementById("counter");
let active=0, cards=[], dragging=false,startX=0,delta=0;

skills.forEach((s,i)=>{
 const c=document.createElement("article");
 c.className="card";
 c.style.setProperty("--accent",s[2]);
 c.innerHTML=`<div class="grid"></div><div class="visual"><div class="dots"></div><div class="ring"></div><div class="cross"></div></div>
 <div class="content"><div class="index">${String(i+1).padStart(2,"0")} / ${skills.length}</div>
 <div><div class="skill">${s[0]}</div><div class="desc">${s[1]}</div></div>
 <div class="meta"><span>TECHNICAL STUDY</span><span>KZ_${String(i+1).padStart(2,"0")}</span></div></div>`;
 stack.appendChild(c); cards.push(c);
});

function render(){
 cards.forEach((c,i)=>{
   let d=i-active;
   if(d < -2) d+=skills.length;
   if(d > skills.length/2) d-=skills.length;
   const x=d*24, z=-Math.abs(d)*75, y=Math.abs(d)*5;
   const rot=d*1.6 + (d===0 ? delta*.018 : 0);
   const scale=1-Math.min(Math.abs(d),4)*.045;
   c.style.zIndex=100-Math.abs(d);
   c.style.opacity=Math.abs(d)>4?0:.98-Math.abs(d)*.1;
   c.style.transform=`translate3d(calc(${x}px + ${d===0?delta*.75:0}px),${y}px,${z}px) rotateY(${rot}deg) rotateZ(${d*.25}deg) scale(${scale})`;
 });
 counter.textContent=`${String(active+1).padStart(2,"0")} / ${String(skills.length).padStart(2,"0")}`;
}
function go(n){active=(n+skills.length)%skills.length;delta=0;render()}
document.getElementById("next").onclick=()=>go(active+1);
document.getElementById("prev").onclick=()=>go(active-1);
window.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(active+1);if(e.key==="ArrowLeft")go(active-1)});
stack.addEventListener("pointerdown",e=>{dragging=true;startX=e.clientX;delta=0;stack.classList.add("dragging");stack.setPointerCapture(e.pointerId)});
stack.addEventListener("pointermove",e=>{if(!dragging)return;delta=e.clientX-startX;render()});
stack.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;stack.classList.remove("dragging");if(Math.abs(delta)>55)go(active+(delta<0?1:-1));else {delta=0;render()}});
stack.addEventListener("pointercancel",()=>{dragging=false;delta=0;render()});
stack.addEventListener("pointermove",e=>{
 if(dragging)return;
 const r=stack.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
 const c=cards[active]; c.style.transform=`translate3d(0,0,0) rotateY(${px*5}deg) rotateX(${-py*4}deg)`;
});
stack.addEventListener("pointerleave",()=>{if(!dragging)render()});
render();
</script>
</body>
</html>
